services:
  # One-shot: renders hermes-config.yaml.template (with values from .env) into the
  # hermes-data volume BEFORE hermes-agent starts. The gateway, dashboard and webui
  # all share hermes-data and read the same /home/hermes/.hermes/config.yaml from it.
  # Hermes itself has no native env-var support for these fields under provider:custom.
  hermes-config-init:
    image: alpine:3
    command: >
      sh -c '
      set -eu;
      apk add --no-cache --quiet gettext;
      : "$${HERMES_MODEL:?HERMES_MODEL not set in .env}";
      : "$${HERMES_PROVIDER:?HERMES_PROVIDER not set in .env}";
      : "$${HERMES_BASE_URL:?HERMES_BASE_URL not set in .env}";
      : "$${HERMES_CONTEXT_LENGTH:?HERMES_CONTEXT_LENGTH not set in .env}";
      : "$${HERMES_TERMINAL_BACKEND:?HERMES_TERMINAL_BACKEND not set in .env}";
      mkdir -p /data;
      envsubst < /tmp/template.yaml > /data/config.yaml;
      chown $${USER_UID:-1000}:$${USER_GID:-1000} /data/config.yaml;
      echo "[init] hermes config rendered into hermes-data volume";
      cat /data/config.yaml
      '
    env_file: .env
    environment:
      - USER_UID=${USER_UID:-1000}
      - USER_GID=${USER_GID:-1000}
    volumes:
      - ./hermes-home:/data
      - ./hermes-config.yaml.template:/tmp/template.yaml:ro
    restart: "no"
    networks:
      - paperclip-stack

  hermes-agent:
    image: nousresearch/hermes-agent:latest
    command: gateway run
    depends_on:
      hermes-config-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8642:8642"
    volumes:
      - hermes-agent-src:/opt/hermes
      - ./hermes-home:/home/hermes/.hermes
    # env_file forwards the full .env to the gateway: provider API keys (Anthropic, OpenAI,
    # OpenRouter, …), messaging tokens (Telegram/Slack/WhatsApp), search APIs (Firecrawl/Exa/…),
    # audio (Whisper/Groq), browser tools — all consumed here. Justified by the breadth of
    # legitimate vars (~15+). Explicit environment: entries below override env_file for matching keys.
    env_file: .env
    environment:
      - HERMES_HOME=/home/hermes/.hermes
      - HERMES_UID=${USER_UID:-1000}
      - HERMES_GID=${USER_GID:-1000}
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${API_SERVER_KEY}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    networks:
      - paperclip-stack

  paperclip-hermes:
    build:
      context: .
    image: ghcr.io/codedmind/paperclip-stack:latest
    depends_on:
      - hermes-agent
    ports:
      - "${PAPERCLIP_BIND_HOST:-127.0.0.1}:3100:3100"
    volumes:
      - ./paperclip-home:/paperclip
      - ./hermes-cli-home:/data/hermes
      - hermes-agent-src:/opt/hermes
    # env_file forwards the full .env: Paperclip auth (BETTER_AUTH_*, PAPERCLIP_*),
    # IP_ADDRESS, Hermes config template vars consumed by start.sh envsubst, plus all
    # provider API keys / search APIs / audio / browser keys used by the local Hermes CLI.
    # Justified by the breadth of legitimate vars (~20+).
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    networks:
      - paperclip-stack

  hermes-dashboard:
    image: nousresearch/hermes-agent:latest
    command: dashboard --host 0.0.0.0 --insecure
    depends_on:
      - hermes-agent
    ports:
      - "${DASHBOARD_BIND_HOST:-127.0.0.1}:9119:9119"
    volumes:
      - ./hermes-home:/home/hermes/.hermes
    # No env_file: the dashboard only talks to the gateway via GATEWAY_HEALTH_URL — it does
    # not need provider keys, messaging tokens or Paperclip secrets. Adding any new var here
    # should be a deliberate choice — list it explicitly below with ${VAR} substitution.
    environment:
      - HERMES_HOME=/home/hermes/.hermes
      - HERMES_UID=${USER_UID:-1000}
      - HERMES_GID=${USER_GID:-1000}
      - GATEWAY_HEALTH_URL=http://hermes-agent:8642
      # Optional dashboard tunables — uncomment + set in .env if needed.
      # - HERMES_DASHBOARD_HOST=${HERMES_DASHBOARD_HOST:-0.0.0.0}
      # - HERMES_DASHBOARD_PORT=${HERMES_DASHBOARD_PORT:-9119}
      # - HERMES_DASHBOARD_TUI=${HERMES_DASHBOARD_TUI:-true}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - paperclip-stack

  piclaw:
    image: ghcr.io/rcarmo/piclaw:latest
    shm_size: '256m'
    init: true
    environment:
      TERM: xterm-256color
      PUID: "${USER_UID:-1000}"
      PGID: "${USER_GID:-1000}"
      PICLAW_WEB_PORT: "${PICLAW_WEB_PORT:-8080}"
      PICLAW_AUTOSTART: "${PICLAW_AUTOSTART:-1}"
    ports:
      - "${PICLAW_WEB_BIND_HOST:-127.0.0.1}:${PICLAW_WEB_PORT:-8080}:8080"
    volumes:
      - ./piclaw-home:/config
      - piclaw-workspace:/workspace
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${PICLAW_CPU_LIMITS:-2}"
          memory: "${PICLAW_MEMORY_LIMITS:-4G}"
    networks:
      - paperclip-stack

  hermes-webui:
    image: ghcr.io/nesquena/hermes-webui:latest
    pid: "service:hermes-agent"
    depends_on:
      - hermes-agent
    ports:
      - "${WEBUI_BIND_HOST:-127.0.0.1}:8787:8787"
    volumes:
      - ./hermes-home:/home/hermeswebui/.hermes
      - hermes-agent-src:/home/hermeswebui/.hermes/hermes-agent
      - ${HERMES_WORKSPACE:-/workspace}:/workspace
    # No env_file: the WebUI has its own auth (HERMES_WEBUI_PASSWORD) and reaches Hermes via
    # the shared hermes-data volume + agent source mount. It does not need provider keys,
    # messaging tokens or Paperclip secrets. Adding any new var here should be deliberate —
    # list it explicitly below with ${VAR} substitution.
    environment:
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      - HERMES_WEBUI_PASSWORD=${HERMES_WEBUI_PASSWORD}
      - WANTED_UID=${USER_UID:-1000}
      - WANTED_GID=${USER_GID:-1000}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - paperclip-stack

networks:
  paperclip-stack:
    driver: bridge

volumes:
  hermes-agent-src:
  piclaw-workspace:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PICLAW_WORKSPACE_PATH:-./piclaw-workspace}
