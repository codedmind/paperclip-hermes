services:
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    command: gateway run
    ports:
      - "127.0.0.1:8642:8642"
    volumes:
      - hermes-agent-src:/opt/hermes
      - hermes-data:/home/hermes/.hermes
    environment:
      - HERMES_HOME=/home/hermes/.hermes
      - HERMES_UID=${USER_UID:-1000}
      - HERMES_GID=${USER_GID:-1000}
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${API_SERVER_KEY}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    networks:
      - hermes-net

  paperclip-hermes:
    build:
      context: .
    image: paperclip-hermes
    depends_on:
      - hermes-agent
    ports:
      - "3100:3100"
    volumes:
      - paperclip-data:/paperclip
      - hermes-cli-data:/data/hermes
      - hermes-agent-src:/opt/hermes
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    networks:
      - hermes-net

  hermes-dashboard:
    image: nousresearch/hermes-agent:latest
    command: dashboard --host 0.0.0.0 --insecure
    depends_on:
      - hermes-agent
    ports:
      - "127.0.0.1:9119:9119"
    volumes:
      - hermes-data:/home/hermes/.hermes
    environment:
      - HERMES_HOME=/home/hermes/.hermes
      - HERMES_UID=${USER_UID:-1000}
      - HERMES_GID=${USER_GID:-1000}
      - GATEWAY_HEALTH_URL=http://hermes-agent:8642
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - hermes-net

  hermes-webui:
    image: ghcr.io/nesquena/hermes-webui:latest
    depends_on:
      - hermes-agent
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - hermes-data:/home/hermeswebui/.hermes
      - hermes-agent-src:/home/hermeswebui/.hermes/hermes-agent
      - ${HERMES_WORKSPACE:-/workspace}:/workspace
    environment:
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      - HERMES_WEBUI_PASSWORD=${HERMES_WEBUI_PASSWORD}
      - WANTED_UID=${USER_UID:-1000}
      - WANTED_GID=${USER_GID:-1000}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - hermes-net

networks:
  hermes-net:
    driver: bridge

volumes:
  paperclip-data:
  hermes-data:
  hermes-cli-data:
  hermes-agent-src:
